# Run for results/rivals-*: LiteLLM 1.106.0 (image digest in results/rivals-overhead/images.txt)
# with the guardrail block below. The block matches the one LLM-Shield-Proxy
# publishes for LiteLLM 1.99.0 (benchmarks/results/http-profile-litellm-1.99.0.md in
# that repo; see docs/research/recheck-2026-10-20.md). The docs page for the guardrail
# (https://docs.litellm.ai/docs/proxy/guardrails/pii_masking_v2) does not say which
# request fields are scanned or what output_parse_pii does with a stream, so the
# README reports what was observed, not what was documented. Re-check every key
# against the docs of the version you pin.
#
# Goal: LiteLLM proxy with its Presidio guardrail in front of the mock upstream,
# configured to mask on the way in and restore on the way out.
model_list:
  - model_name: mock-model              # used by loadgen
    litellm_params:
      model: openai/mock-model
      api_base: http://host.docker.internal:19000/v1   # cmd/mockupstream on the host
      api_key: sk-mock
  - model_name: eval-model              # used by eval
    litellm_params:
      model: openai/mock-model
      api_base: http://host.docker.internal:19000/v1
      api_key: sk-mock

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      output_parse_pii: true               # restore masked values in the response
      default_on: true
