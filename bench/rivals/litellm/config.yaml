# The guardrail block matches the one LLM-Shield-Proxy publishes for LiteLLM 1.99.0
# (benchmarks/results/http-profile-litellm-1.99.0.md in that repo; see
# docs/research/recheck-2026-10-20.md), but this repo has not run it yet. Check every
# key against https://docs.litellm.ai/docs/proxy/guardrails/pii_masking_v2 for
# the version you pin before publishing numbers from it.
#
# Goal: LiteLLM proxy with its Presidio guardrail in front of the mock upstream,
# configured to mask on the way in and restore on the way out.
model_list:
  - model_name: mock-model              # used by loadgen
    litellm_params:
      model: openai/mock-model
      api_base: http://host.docker.internal:19000/v1   # cmd/mockupstream on the host
      api_key: sk-mock
  - model_name: eval-model              # used by eval
    litellm_params:
      model: openai/mock-model
      api_base: http://host.docker.internal:19000/v1
      api_key: sk-mock

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      output_parse_pii: true               # restore masked values in the response
      default_on: true
