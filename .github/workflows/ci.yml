name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: format and vet
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: tests (race detector)
        run: go test -race ./...
      - name: short fuzz
        run: make fuzz FUZZTIME=15s
      - name: build
        run: go build ./...
